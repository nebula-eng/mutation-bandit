[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mutation-bandit"
version = "1.0.0"
description = "Structure-repair scheduling for coverage-guided fuzzers: a controlled study"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Blue" }]
keywords = ["fuzzing", "coverage-guided", "mutation-scheduling", "corpus-admission", "benchmark"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
plots = ["numpy>=1.26", "matplotlib>=3.8"]
dev = ["flake8>=7.0", "numpy>=1.26", "matplotlib>=3.8"]

[project.scripts]
mutation-bandit = "mutation_bandit.cli:main"

[project.urls]
Homepage = "https://github.com/nebula-eng/mutation-bandit"
Documentation = "https://github.com/nebula-eng/mutation-bandit/tree/main/docs"
Issues = "https://github.com/nebula-eng/mutation-bandit/issues"
Changelog = "https://github.com/nebula-eng/mutation-bandit/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
